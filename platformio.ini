; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
; Plataforma FIJADA a 7.1.3 (probada en este proyecto: compila OK). Ojo con el
; numero: la 7.x de PlatformIO NO trae arduino-esp32 3.x. Su paquete arduino es
; framework-arduinoespressif32 @ 4.20017.260907+sha.dcc1105b, cuya cabecera
; cores/esp32/esp_arduino_version.h dice 2.0.17, y usa el mismo toolchain
; (toolchain-xtensa-esp32 8.4.0) y el mismo esptool que la 6.13.0: el primer
; digito es la revision de empaquetado de PlatformIO. Por eso el fw.bin sale
; exactamente igual que con 6.13.0.
; El core 3.x / IDF 5 exigiria la plataforma de la comunidad (pioarduino) y,
; con FastLED 3.10.x, la tabla de particiones A2 por tamano.
platform = espressif32@7.1.3
board = esp32doit-devkit-v1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
; Build de release (sin salida por consola): agregar -DDEBUGLEVEL=0 a build_flags.
; Medido en este proyecto, la diferencia con la build de depuracion es -26 KB de
; flash y -0,8 KB de RAM. El nivel por defecto vive en src/config/debug_config.h.
build_flags =
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -DDEFAULT_WIFI_SSID=\""$(WIFI_SSID)"\"
    -DDEFAULT_WIFI_PASS=\""$(WIFI_PASS)"\"
board_build.filesystem = littlefs
lib_deps =
	ArduinoJson@^7.0.0
	esp32async/ESPAsyncWebServer@^3.7.3
	esp32async/AsyncTCP@^3.3.7
	; fastled/FastLED FIJADO a 3.9.20: la ultima que compila con este core
	; (arduino-esp32 2.0.17) y entra en la particion app por defecto.
	; Medido en este proyecto (mismo codigo, solo cambia la version de la lib):
	;   3.5.0  -> 1.050.873 B (80,2%)
	;   3.7.8  -> 1.057.629 B (80,7%)
	;   3.9.20 -> 1.084.729 B (82,8%)  = +34 KB respecto a 3.5.0
	;   3.10.7 -> NO compila con el core 2.x: "looser throw specifier" en
	;             fl/fs/sd/fs_sdcard_arduino.cpp.hpp y redefinicion de
	;             fl::gfx::blurColumns. Ademas 3.10.x usa el driver RMT5
	;             (IDF 5, o sea core 3.x) y el binario se va a ~1,45 MB, que
	;             no cabe sin la tabla A2 (app 1,5 MB).
	; Si algo fallase en el equipo, volver a 3.5.0 es cambiar solo esta linea.
	fastled/FastLED@3.9.20
	https://github.com/alexminator/Battery18650Stats.git
	adafruit/DHT sensor library@^1.4.4
	adafruit/Adafruit Unified Sensor@^1.1.11
	ayushsharma82/ElegantOTA@^4.0.0
